<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>あなたが、いま優先して学ぶべき領域を分析します。</title>
<style>
  :root{
    --color-bg: #F6F5F2;
    --color-surface: #FFFFFF;
    --color-primary: #2e2e40;
    --color-primary-soft: #55556b;
    --color-primary-faint: #eceaf0;
    --color-accent: #56566b;
    --color-accent-soft: #e9e9ee;
    --color-accent-text: #56566b;
    --color-text: #2e2e40;
    --color-text-sub: #74747f;
    --color-border: #e4e2dc;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(46,46,64,0.06), 0 4px 16px rgba(46,46,64,0.05);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 20px 40px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 20px;
  }
  .brand-dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--color-accent);
    flex-shrink:0;
  }
  .brand-name{
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--color-text-sub);
  }

  /* ---- Intro ---- */
  .intro{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    animation: fadeIn .5s ease;
  }
  .intro-eyebrow{
    font-size: 12px;
    font-weight: 600;
    color: var(--color-accent-text);
    margin-bottom: 10px;
  }
  .intro h1{
    font-size: 32px;
    line-height: 1.4;
    margin: 0 0 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .intro p{
    font-size: 15px;
    line-height: 1.9;
    color: var(--color-text-sub);
    margin: 0 0 12px;
  }
  .intro-tagline{
    color: var(--color-primary);
    font-weight: 600;
  }
  .intro-meta{
    display:flex;
    gap: 18px;
    margin: 28px 0 8px;
    padding: 16px 0;
    border-top: 1px solid var(--color-border);
    border-bottom: 1px solid var(--color-border);
  }
  .intro-meta div{ flex:1; }
  .intro-meta .num{
    font-size: 20px;
    font-weight: 700;
    color: var(--color-primary);
  }
  .intro-meta .label{
    font-size: 12px;
    color: var(--color-text-sub);
    margin-top: 2px;
  }

  .profile-section{
    margin-top: 24px;
  }
  .profile-row{
    display:flex;
    gap: 12px;
  }
  .profile-field{
    flex: 1;
    display:flex;
    flex-direction:column;
    min-width: 0;
  }
  .profile-label{
    font-size: 12.5px;
    font-weight: 600;
    color: var(--color-text);
    margin-bottom: 8px;
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .optional-tag{
    font-size: 10.5px;
    font-weight: 600;
    color: var(--color-text-sub);
    background: var(--color-primary-faint);
    border-radius: 20px;
    padding: 2px 8px;
  }
  .profile-select{
    appearance: none;
    -webkit-appearance: none;
    background: var(--color-surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0L5 6L10 0Z' fill='%2374747f'/></svg>") no-repeat right 14px center;
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius);
    padding: 12px 30px 12px 14px;
    font-size: 14px;
    color: var(--color-text);
    width: 100%;
    cursor: pointer;
  }
  .profile-select:focus{
    outline: none;
    border-color: var(--color-primary);
  }

  .btn-primary{
    margin-top: 32px;
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 17px 20px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    width: 100%;
    transition: transform .15s ease, opacity .15s ease;
  }
  .btn-primary:active{ transform: scale(0.98); opacity: 0.9; }

  /* ---- Quiz ---- */
  .quiz{ display:none; flex:1; flex-direction:column; }
  .quiz.active{ display:flex; }

  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 10px;
  }
  .progress-count{
    font-size: 13px;
    color: var(--color-text-sub);
    font-variant-numeric: tabular-nums;
  }
  .progress-area{
    font-size: 12px;
    color: var(--color-accent-text);
    font-weight: 600;
  }
  .progress-track{
    height: 4px;
    background: var(--color-primary-faint);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 40px;
  }
  .progress-fill{
    height: 100%;
    background: var(--color-primary);
    border-radius: 4px;
    transition: width .35s ease;
  }

  .question-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height: 160px;
  }
  .question-text{
    font-size: 21px;
    line-height: 1.7;
    font-weight: 600;
    color: var(--color-text);
    animation: fadeIn .35s ease;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top: 36px;
  }
  .option-btn{
    text-align:left;
    background: var(--color-surface);
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    font-size: 15.5px;
    color: var(--color-text);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .option-btn:active{ transform: scale(0.985); }
  .option-btn.selected{
    border-color: var(--color-primary);
    background: var(--color-primary-faint);
    font-weight: 600;
  }

  .quiz-nav{
    margin-top: 28px;
    display:flex;
    justify-content: flex-start;
  }
  .btn-back{
    background: none;
    border: none;
    color: var(--color-text-sub);
    font-size: 14px;
    padding: 10px 4px;
    cursor: pointer;
    visibility: hidden;
  }
  .btn-back.visible{ visibility: visible; }

  /* ---- Result ---- */
  .result{ display:none; flex-direction:column; animation: fadeIn .5s ease; }
  .result.active{ display:flex; }

  .result-header{ margin-bottom: 28px; }
  .result-eyebrow{
    font-size: 12px;
    color: var(--color-accent);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .result-header h2{
    font-size: 22px;
    line-height: 1.6;
    margin: 0;
    font-weight: 700;
  }

  .card{
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 22px 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card h3{
    font-size: 14px;
    margin: 0 0 16px;
    color: var(--color-text-sub);
    font-weight: 600;
  }

  .radar-card{ display:flex; justify-content:center; }

  .score-list{ display:flex; flex-direction:column; gap: 14px; }
  .score-row .score-top{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size: 14px; margin-bottom: 6px;
  }
  .score-row .score-name{ font-weight: 600; color: var(--color-text); }
  .score-row .score-val{ color: var(--color-text-sub); font-variant-numeric: tabular-nums; }
  .score-bar-track{
    height: 8px;
    background: var(--color-primary-faint);
    border-radius: 8px;
    overflow: hidden;
  }
  .score-bar-fill{
    height: 100%;
    border-radius: 8px;
    background: var(--color-primary-soft);
  }
  .score-row.priority-1 .score-bar-fill{ background: var(--color-primary); }
  .score-row.priority-1 .score-name{ color: var(--color-primary); }
  .score-row.priority-2 .score-bar-fill{ background: var(--color-accent); }

  .priority-badges{ display:flex; gap:8px; margin-bottom: 4px; flex-wrap: wrap; }
  .badge{
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .badge-1{ background: var(--color-primary); color:#fff; }
  .badge-2{ background: var(--color-accent-soft); color: var(--color-accent-text); }

  .priority-block{ margin-bottom: 22px; }
  .priority-block:last-child{ margin-bottom: 0; }
  .priority-block .p-title{
    font-size: 16px;
    font-weight: 700;
    margin: 6px 0 8px;
  }
  .priority-block p{
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--color-text-sub);
    margin: 0 0 6px;
  }

  .text-block p{
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--color-text);
    margin: 0 0 14px;
  }
  .text-block p:last-child{ margin-bottom: 0; }
  .text-block .sub-label{
    display:block;
    font-size: 12px;
    color: var(--color-text-sub);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .physio-card{
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    text-align: center;
  }
  .physio-logo{
    height: 26px;
    width: auto;
    margin: 0 auto 18px;
    display: block;
  }
  .physio-card p{
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--color-text-sub);
    margin: 0 0 20px;
    text-align: left;
  }
  .btn-cta{
    display:block;
    text-align:center;
    background: var(--color-primary);
    color: #fff;
    text-decoration:none;
    border-radius: var(--radius);
    padding: 15px 18px;
    font-size: 15px;
    font-weight: 700;
    transition: opacity .15s ease;
  }
  .btn-cta:active{ opacity: 0.85; }

  .retake{
    text-align:center;
    margin-top: 20px;
  }
  .retake button{
    background:none;
    border:none;
    color: var(--color-text-sub);
    font-size: 13px;
    text-decoration: underline;
    cursor:pointer;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">今の自分に必要な学びチェック</span>
  </div>

  <!-- INTRO -->
  <div class="intro" id="intro">
    <div class="intro-eyebrow">トレーナー・セラピスト向け</div>
    <h1>あなたの強みと<br>伸ばしたい領域をチェック。</h1>
    <p>質問に答えるだけで、自分が今何を優先して学ぶと良いのかがすぐにわかります。</p>
    <p class="intro-tagline">「何を学べばいいかわからない」を、次に学ぶべき領域が見つかるきっかけに。</p>
    <div class="intro-meta">
      <div>
        <div class="num">１分</div>
        <div class="label">所要時間</div>
      </div>
      <div>
        <div class="num">無料</div>
        <div class="label">登録不要</div>
      </div>
      <div>
        <div class="num">すぐわかる</div>
        <div class="label">分析結果</div>
      </div>
    </div>

    <div class="profile-section">
      <div class="profile-row">
        <div class="profile-field">
          <label class="profile-label" for="genderSelect">性別<span class="optional-tag">任意</span></label>
          <select id="genderSelect" class="profile-select">
            <option value="">未選択</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="その他">その他</option>
            <option value="回答しない">回答しない</option>
          </select>
        </div>
        <div class="profile-field">
          <label class="profile-label" for="experienceSelect">経験年数<span class="optional-tag">任意</span></label>
          <select id="experienceSelect" class="profile-select">
            <option value="">未選択</option>
            <option value="1年未満">1年未満</option>
            <option value="1〜3年">1〜3年</option>
            <option value="4〜9年">4〜9年</option>
            <option value="10年以上">10年以上</option>
          </select>
        </div>
      </div>
    </div>

    <button class="btn-primary" id="startBtn">はじめる</button>
  </div>

  <!-- QUIZ -->
  <div class="quiz" id="quiz">
    <div class="progress-row">
      <span class="progress-area" id="progressArea"></span>
      <span class="progress-count" id="progressCount">1 / 15</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:6.6%"></div>
    </div>

    <div class="question-wrap">
      <div class="question-text" id="questionText"></div>
      <div class="options" id="options"></div>
    </div>

    <div class="quiz-nav">
      <button class="btn-back" id="backBtn">← 前の質問に戻る</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="result" id="result"></div>

</div>

      direction: "動作の課題とエクササイズの目的を結びつけて考える視点を持つと、選択に一貫性が出てきます。あわせて、進行・後退の判断基準を整理しておくと、変化が出ないときの修正もしやすくなります。"
    },
    {
      tendency: "知識自体は持っていても、それを目の前の動きや説明と結びつける場面で迷いやすい傾向があります。",
      theme: "解剖学・運動学の実践的な活用／機能解剖と動作の結びつけ方",
      direction: "筋肉や関節の知識を、実際の動作パターンと結びつけて捉え直す練習をすると、現場での応用力が高まります。知識を「説明できる形」に翻訳する練習も有効です。"
    },
    {
      tendency: "身体をみるときの着眼点や、得られた情報から何を考えるかという推論の部分で迷いやすい傾向があります。",
      theme: "評価の着眼点の整理／評価結果から原因を推論する考え方",
      direction: "評価の目的をひとつずつ明確にし、得られた情報を仮説として検証していくプロセスを学ぶと、判断に自信が持てるようになります。"
    },
    {
      tendency: "理解している内容を分かりやすく伝えたり、クライアントの本音や困りごとを引き出したりする場面で迷いやすい傾向があります。",
      theme: "分かりやすい伝え方／クライアントの困りごとを引き出す問診・カウンセリング",
      direction: "専門用語を日常の言葉に言い換える練習や、オープンクエスチョンを使ったカウンセリングの型を学ぶと、伝わり方や引き出せる情報が変わってきます。"
    }
  ];

  // unordered pair key "a-b" (a<b)
  var COMBO = {
    "0-1": "情報を集めること自体に加えて、その情報を目の前のクライアントに合わせてどう選び、エクササイズに落とし込むかを整理すると、学びが実践につながりやすくなりそうです。",
    "0-2": "情報を調べる力に加えて、解剖学や運動学の基礎知識を現場でどう使うかを結びつけて整理すると、学んだ内容がそのまま現場で活きやすくなりそうです。",
    "0-3": "情報収集の仕方に加えて、集めた知識を評価の視点にどう活かすかを整理すると、迷いが少しずつ減っていきそうです。",
    "0-4": "情報を選ぶ力に加えて、学んだことをクライアントにどう分かりやすく伝えるかをセットで整理すると、学びが現場で活きやすくなりそうです。",
    "1-2": "エクササイズの選択肢を増やすことに加えて、その土台となる解剖学・運動学の知識を整理すると、種目を選ぶ根拠が明確になっていきそうです。",
    "1-3": "評価方法を増やすだけでなく、評価した情報からどのようにエクササイズを選択するかを学ぶとよさそうです。",
    "1-4": "エクササイズの引き出しを増やすことに加えて、それをクライアントにどう伝え、実践してもらうかをセットで考えると、変化につながりやすくなりそうです。",
    "2-3": "解剖学・運動学の知識に加えて、その知識を評価の場面でどう活用し、結果を解釈するかを整理すると、評価そのものに自信が持てるようになりそうです。",
    "2-4": "身体の仕組みの理解に加えて、それをクライアントに分かりやすい言葉で伝える練習をセットで行うと、知識が伝わりやすくなりそうです。",
    "3-4": "評価から得た情報を整理する力に加えて、その内容をクライアントに分かりやすく伝え、困りごとを引き出す力をセットで磨くと、評価が現場でより活きてきそうです。"
  };

  var state = { current: 0, answers: new Array(15).fill(null), profile: { gender: null, experience: null } };

  var introEl = document.getElementById('intro');
  var quizEl = document.getElementById('quiz');
  var resultEl = document.getElementById('result');
  var startBtn = document.getElementById('startBtn');
  var backBtn = document.getElementById('backBtn');
  var progressArea = document.getElementById('progressArea');
  var progressCount = document.getElementById('progressCount');
  var progressFill = document.getElementById('progressFill');
  var questionText = document.getElementById('questionText');
  var optionsEl = document.getElementById('options');

  var genderSelect = document.getElementById('genderSelect');
  var experienceSelect = document.getElementById('experienceSelect');
  genderSelect.addEventListener('change', function(){ state.profile.gender = genderSelect.value || null; });
  experienceSelect.addEventListener('change', function(){ state.profile.experience = experienceSelect.value || null; });

  startBtn.addEventListener('click', function(){
    introEl.style.display = 'none';
    quizEl.classList.add('active');
    renderQuestion();
  });

  backBtn.addEventListener('click', function(){
    if(state.current > 0){
      state.current -= 1;
      renderQuestion();
    }
  });

  function renderQuestion(){
    var q = QUESTIONS[state.current];
    progressArea.textContent = AREA_NAMES[q.area];
    progressCount.textContent = (state.current+1) + " / 15";
    progressFill.style.width = ((state.current+1)/15*100) + "%";
    questionText.textContent = q.text;
    backBtn.classList.toggle('visible', state.current > 0);

    optionsEl.innerHTML = '';
    var selected = state.answers[state.current];
    OPTIONS.forEach(function(opt, i){
      var btn = document.createElement('button');
      btn.className = 'option-btn' + (selected === opt.score ? ' selected' : '');
      btn.textContent = opt.label;
      btn.addEventListener('click', function(){ selectAnswer(opt.score); });
      optionsEl.appendChild(btn);
    });
  }

  function selectAnswer(score){
    state.answers[state.current] = score;
    if(state.current < 14){
      setTimeout(function(){
        state.current += 1;
        renderQuestion();
      }, 160);
    } else {
      setTimeout(showResult, 200);
    }
  }

  function computeScores(){
    var scores = [0,0,0,0,0];
    QUESTIONS.forEach(function(q, i){
      scores[q.area] += state.answers[i];
    });
    return scores;
  }

  function submitToSheet(scores, top1Name, top2Name){
    if(!GOOGLE_SHEET_ENDPOINT) return;
    var payload = {
      gender: state.profile.gender,
      experience: state.profile.experience,
      answers: state.answers,
      scores: scores,
      top1: top1Name,
      top2: top2Name
    };
    try{
      fetch(GOOGLE_SHEET_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(function(){ /* 送信失敗時も画面表示は継続する */ });
    } catch(err){ /* fetch非対応環境などは無視する */ }
  }

  function showResult(){
    quizEl.classList.remove('active');
    var scores = computeScores();

    var ranked = scores.map(function(s,i){ return {area:i, score:s}; })
                        .sort(function(a,b){ return b.score - a.score; });
    var top1 = ranked[0], top2 = ranked[1];
    var pairKey = [top1.area, top2.area].sort(function(a,b){return a-b;}).join('-');
    var comboText = COMBO[pairKey];

    submitToSheet(scores, AREA_NAMES[top1.area], AREA_NAMES[top2.area]);

    var html = '';
    html += '<div class="result-header">';
    html += '  <div class="result-eyebrow">診断結果</div>';
    html += '  <h2>今のあなたに必要な学習領域が見えてきました。</h2>';
    html += '</div>';

    // radar
    html += '<div class="card radar-card">' + buildRadarSVG(scores) + '</div>';

    // score list
    html += '<div class="card"><h3>5領域のスコア</h3><div class="score-list">';
    scores.forEach(function(s, i){
      var cls = '';
      if(i === top1.area) cls = ' priority-1';
      else if(i === top2.area) cls = ' priority-2';
      var pct = Math.round((s-3)/(15-3)*100);
      pct = Math.max(pct, 6);
      html += '<div class="score-row' + cls + '">';
      html += '  <div class="score-top"><span class="score-name">' + AREA_NAMES[i] + '</span><span class="score-val">' + labelForAreaScore(s) + '</span></div>';
      html += '  <div class="score-bar-track"><div class="score-bar-fill" style="width:' + pct + '%"></div></div>';
      html += '</div>';
    });
    html += '</div></div>';

    // priorities
    html += '<div class="card">';
    html += '  <div class="priority-badges"><span class="badge badge-1">優先度1位</span></div>';
    html += '  <div class="priority-block">';
    html += '    <div class="p-title">' + AREA_NAMES[top1.area] + '</div>';
    html += '    <p>' + AREA_CONTENT[top1.area].tendency + '</p>';
    html += '  </div>';
    html += '  <div class="priority-badges"><span class="badge badge-2">優先度2位</span></div>';
    html += '  <div class="priority-block">';
    html += '    <div class="p-title">' + AREA_NAMES[top2.area] + '</div>';
    html += '    <p>' + AREA_CONTENT[top2.area].tendency + '</p>';
    html += '  </div>';
    html += '</div>';

    // tendency / theme / direction
    html += '<div class="card text-block">';
    html += '  <h3>回答結果から考えられる傾向</h3>';
    html += '  <p>' + comboText + '</p>';
    html += '  <span class="sub-label">これから学ぶと良さそうなテーマ</span>';
    html += '  <p>' + AREA_CONTENT[top1.area].theme + '<br>' + AREA_CONTENT[top2.area].theme + '</p>';
    html += '  <span class="sub-label">具体的な学習の方向性</span>';
    html += '  <p>' + AREA_CONTENT[top1.area].direction + '</p>';
    html += '  <p>' + AREA_CONTENT[top2.area].direction + '</p>';
    html += '</div>';

    // physioplus CTA
    html += '<div class="card physio-card">';
    html += '  <img class="physio-logo" src="' + LOGO_DATA_URI + '" alt="Physioplus">';
    html += '  <p>Physioplus（フィジオプラス）は、トレーナー・セラピストが現場で活用できる知識や考え方を、記事やオンラインプログラムで学べる学習プラットフォームです。今回の結果で気になったテーマがあれば、フィジオプラスで学びを探してみてください。</p>';
    html += '  <a class="btn-cta" href="https://www.physioplus.jp/" target="_blank" rel="noopener">フィジオプラスで学びを探す</a>';
    html += '</div>';

    html += '<div class="retake"><button id="retakeBtn">もう一度チェックする</button></div>';

    resultEl.innerHTML = html;
    resultEl.classList.add('active');

    document.getElementById('retakeBtn').addEventListener('click', function(){
      state = { current: 0, answers: new Array(15).fill(null), profile: state.profile };
      resultEl.classList.remove('active');
      resultEl.innerHTML = '';
      quizEl.classList.add('active');
      renderQuestion();
      window.scrollTo(0,0);
    });

    window.scrollTo(0,0);
  }

  function buildRadarSVG(scores){
    var W = 370, H = 320;
    var centerX = W/2, centerY = 168;
    var maxR = 78;
    var labelR = 110;
    var minScore = 3, maxScore = 15;
    var n = 5;
    var angleStep = (Math.PI*2)/n;
    var startAngle = -Math.PI/2;

    function pointFor(value, i){
      var ratio = (value - minScore) / (maxScore - minScore);
      ratio = Math.max(0, Math.min(1, ratio));
      var r = ratio * maxR;
      var angle = startAngle + angleStep*i;
      return { x: centerX + r*Math.cos(angle), y: centerY + r*Math.sin(angle) };
    }
    function labelPointFor(i){
      var angle = startAngle + angleStep*i;
      return { x: centerX + labelR*Math.cos(angle), y: centerY + labelR*Math.sin(angle) };
    }

    var gridLevels = [0.25, 0.5, 0.75, 1];
    var gridPolys = gridLevels.map(function(level){
      var pts = [];
      for(var i=0;i<n;i++){
        var angle = startAngle + angleStep*i;
        var r = level*maxR;
        pts.push((centerX + r*Math.cos(angle)) + ',' + (centerY + r*Math.sin(angle)));
      }
      return pts.join(' ');
    });

    var axisLines = '';
    for(var i=0;i<n;i++){
      var angle = startAngle + angleStep*i;
      var x2 = centerX + maxR*Math.cos(angle);
      var y2 = centerY + maxR*Math.sin(angle);
      axisLines += '<line x1="'+centerX+'" y1="'+centerY+'" x2="'+x2+'" y2="'+y2+'" stroke="#e4e2dc" stroke-width="1"/>';
    }

    var dataPts = scores.map(function(s,i){ return pointFor(s,i); });
    var dataPolyStr = dataPts.map(function(p){ return p.x + ',' + p.y; }).join(' ');

    var dots = dataPts.map(function(p){
      return '<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="#2e2e40"/>';
    }).join('');

    var labels = '';
    for(var i=0;i<n;i++){
      var lp = labelPointFor(i);
      var anchor = 'middle';
      if(lp.x < centerX - 8) anchor = 'end';
      else if(lp.x > centerX + 8) anchor = 'start';
      labels += '<text x="'+lp.x+'" y="'+lp.y+'" text-anchor="'+anchor+'" dominant-baseline="middle" font-size="12" fill="#55556b" font-weight="600">'+AREA_SHORT[i]+'</text>';
    }

    var svg = '<svg width="100%" height="auto" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="max-width:340px;display:block" xmlns="http://www.w3.org/2000/svg">';
    svg += '<g>';
    gridPolys.forEach(function(poly, idx){
      svg += '<polygon points="'+poly+'" fill="none" stroke="#e4e2dc" stroke-width="1"/>';
    });
    svg += axisLines;
    svg += '<polygon points="'+dataPolyStr+'" fill="#56566b" fill-opacity="0.16" stroke="#2e2e40" stroke-width="2"/>';
    svg += dots;
    svg += labels;
    svg += '</g></svg>';
    return svg;
  }

})();
</script>
